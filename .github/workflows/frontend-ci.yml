# Pull requests into dev only: a push (dev merge, prod promote) runs no CI and
# promote PRs (dev → prod) are not CI'd. Docs-only PRs run nothing. The repo is
# public (free minutes); this matches the portfolio's owner CI rule of
# 2026-11-25 for consistency (ADR-0004).
name: Frontend CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'infrastructure/terraform/modules/frontend-cdn/functions/**'
      - 'next.config.js'
      - 'next-env.d.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.eslintrc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # CloudFront Function unit tests; run after the build so they also check
      # the edge's Markdown twins/404 body against out/.
      - name: Edge function tests
        run: pnpm test:edge
